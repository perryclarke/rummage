name: QLZip
options:
  bundleIdPrefix: com.perryclarke
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: YB35Q4YF78
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES

targets:
  QLZip:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - target: QLZipPreview
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: QLZip
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "© 2026 Perry Clarke"
    entitlements:
      path: App/QLZip.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.perryclarke.QLZip
        GENERATE_INFOPLIST_FILE: NO

  QLZipPreview:
    type: app-extension
    platform: macOS
    sources:
      - PreviewExtension
      - path: CArchive
        buildPhase: none
    dependencies:
      - sdk: Quartz.framework
      - sdk: libarchive.tbd
    info:
      path: PreviewExtension/Info.plist
      properties:
        CFBundleDisplayName: QLZip Preview
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLIsDataBasedPreview: false
            QLSupportsSearchableItems: false
            QLSupportedContentTypes:
              - public.zip-archive
              - com.pkware.zip-archive
              - public.tar-archive
              - org.gnu.gnu-tar-archive
              - org.gnu.gnu-zip-archive
              - org.gnu.gnu-zip-tar-archive
              - public.bzip2-archive
              - public.tar-bzip2-archive
              - org.tukaani.xz-archive
              - org.tukaani.tar-xz-archive
              - public.xz-archive
    entitlements:
      path: PreviewExtension/QLZipPreview.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.perryclarke.QLZip.Preview
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/CArchive
