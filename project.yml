name: Rummage
options:
  bundleIdPrefix: com.perryclarke
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: YB35Q4YF78
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_VERSION: "6.0"
    # The version for both the app and the extension (their Info.plists read these).
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "2"
    DEAD_CODE_STRIPPING: YES

targets:
  Rummage:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - target: RummagePreview
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Rummage
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "© 2026 Perry Clarke"
    entitlements:
      path: App/Rummage.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.perryclarke.Rummage
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  RummagePreview:
    type: app-extension
    platform: macOS
    sources:
      - PreviewExtension
      - path: CArchive
        buildPhase: none
    dependencies:
      - sdk: Quartz.framework
      - sdk: libarchive.tbd
    info:
      path: PreviewExtension/Info.plist
      properties:
        CFBundleDisplayName: Rummage Preview
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLIsDataBasedPreview: false
            QLSupportsSearchableItems: false
            QLSupportedContentTypes:
              - public.zip-archive
              - com.pkware.zip-archive
              - public.tar-archive
              - org.gnu.gnu-tar-archive
              - org.gnu.gnu-zip-archive
              - org.gnu.gnu-zip-tar-archive
              - public.bzip2-archive
              - public.tar-bzip2-archive
              - org.tukaani.xz-archive
              - org.tukaani.tar-xz-archive
              - public.xz-archive
    entitlements:
      path: PreviewExtension/RummagePreview.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.perryclarke.Rummage.Preview
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/CArchive
